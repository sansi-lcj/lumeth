name: Lumeth
options:
  bundleIdPrefix: com.sansi
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.9"
targets:
  Lumeth:
    type: application
    platform: macOS
    sources:
      - path: Sources/Pulse
      - path: Resources
        excludes:
          - Info.plist
          - Lumeth.entitlements
          - AppIcon.icns
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sansi.lumeth
        PRODUCT_NAME: Lumeth
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Lumeth.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SV2LZPC92A
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        COMBINE_HIDPI_IMAGES: YES
schemes:
  Lumeth:
    build:
      targets:
        Lumeth: all
    run:
      config: Debug
    archive:
      config: Release
