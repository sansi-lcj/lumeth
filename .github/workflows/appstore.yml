name: appstore

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the signed package to App Store Connect
        type: boolean
        default: true
      version:
        description: Marketing version
        type: string
        default: "1.1"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  appstore:
    runs-on: macos-13
    timeout-minutes: 35
    env:
      BUNDLE_ID: com.sansi.lumeth
      TEAM_ID: SV2LZPC92A
      VERSION: ${{ inputs.version || '1.1' }}
      APPLE_DISTRIBUTION_P12: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
      APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
      MAC_INSTALLER_P12: ${{ secrets.MAC_INSTALLER_P12 }}
      MAC_INSTALLER_P12_PASSWORD: ${{ secrets.MAC_INSTALLER_P12_PASSWORD }}
      MAC_APP_STORE_PROFILE: ${{ secrets.MAC_APP_STORE_PROFILE }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare version
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist

      - name: Import signing identities and profile
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/lumeth-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$APPLE_DISTRIBUTION_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          echo "$MAC_INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/distribution.p12" \
            -k "$KEYCHAIN" -P "$APPLE_DISTRIBUTION_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          security import "$RUNNER_TEMP/installer.p12" \
            -k "$KEYCHAIN" -P "$MAC_INSTALLER_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/installer.p12"

      - name: Archive without signing
        run: |
          xcodegen generate
          xcodebuild \
            -project Lumeth.xcodeproj \
            -scheme Lumeth \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath build/Lumeth.xcarchive \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Sign app and build product archive
        run: |
          set -euo pipefail
          APP="build/Lumeth.xcarchive/Products/Applications/Lumeth.app"
          mkdir -p build/appstore
          ditto "$APP" build/appstore/Lumeth.app

          echo "$MAC_APP_STORE_PROFILE" | base64 --decode > build/appstore/Lumeth.provisionprofile
          cp build/appstore/Lumeth.provisionprofile build/appstore/Lumeth.app/Contents/embedded.provisionprofile
          xattr -cr build/appstore/Lumeth.app

          DISTRIBUTION_IDENTITY="$(security find-identity -v -p codesigning | awk -F'"' '/Apple Distribution/ {print $2; exit}')"
          INSTALLER_IDENTITY="$(security find-identity -v | awk -F'"' '/Mac Developer Installer/ {print $2; exit}')"
          test -n "$DISTRIBUTION_IDENTITY"
          test -n "$INSTALLER_IDENTITY"

          codesign \
            --force --deep --options runtime \
            --entitlements scripts/AppStore.entitlements \
            --sign "$DISTRIBUTION_IDENTITY" \
            build/appstore/Lumeth.app

          codesign --verify --deep --strict build/appstore/Lumeth.app
          productbuild \
            --component build/appstore/Lumeth.app /Applications \
            --sign "$INSTALLER_IDENTITY" \
            build/Lumeth-AppStore.pkg

      - name: Validate package
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_P8" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --validate-app \
            -f build/Lumeth-AppStore.pkg \
            -t macos \
            --api-key "$ASC_KEY_ID" \
            --api-issuer "$ASC_ISSUER_ID"

      - name: Upload to App Store Connect
        if: ${{ inputs.upload || startsWith(github.ref, 'refs/tags/') }}
        run: |
          xcrun altool --upload-app \
            -f build/Lumeth-AppStore.pkg \
            -t macos \
            --api-key "$ASC_KEY_ID" \
            --api-issuer "$ASC_ISSUER_ID"

      - name: Upload signed package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumeth-AppStore-pkg
          path: build/Lumeth-AppStore.pkg
          if-no-files-found: error
