name: build

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Resources/**"
      - "Package.swift"
      - "project.yml"
      - "scripts/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "Sources/**"
      - "Resources/**"
      - "Package.swift"
      - "project.yml"
      - "scripts/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-build:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
